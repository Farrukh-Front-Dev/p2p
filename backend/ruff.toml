line-length = 100
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",   # FastAPI Depends() in defaults — bu intentional
    "RUF001", # ambiguous unicode (o'zbek/rus matnlari uchun)
    "RUF002",
    "RUF003",
    "E501",   # uzun satrlar (locale matnlari)
    "UP042",  # StrEnum — xulq o'zgarmasligi uchun (str, Enum) saqlanadi
]

[lint.per-file-ignores]
"tests/*" = ["B011", "SIM"]
"migrations/*" = ["E", "F", "UP"]
