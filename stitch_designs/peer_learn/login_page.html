            border-radius: 50%;
            background-color: #44ddc1;

        }

<body class="bg-background text-on-background selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-40 bg-surface-container-low border-b border-outline-variant flex justify-between items-center h-16 px-margin-mobile lg:px-margin-desktop">
<div class="flex items-center gap-sm">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Peer Learn</span>
</div>
<div class="flex items-center gap-md">
<button class="hover:bg-surface-variant rounded-full p-2 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant">
<img alt="User Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1cRpA3QMG1_WJ22TVhF8gxL5J_3SHek8xYFdAFiT9vHzvBWoyoNJADHE_rbx9VM_U3qFhHm9D6LA2HQvtinfMSOHZ0Shyh1j18O2xdnVmNoPU1EhxqB__ni61oJOnrY-H9Ulzcmdig9DrTrUZu4k9AuRAzt9-PZcuRrUdWk3iQyLB_qsgXeam0n3qP0dLdl1irMATyRcM02Ik2xGSOGCLgfBdc_1pk1c5q64wHOLjnCBzk54dH1Vr1rypzan4U6OH63kBgMta6_ht"/>
</div>
</div>
</header>
<main class="min-h-screen flex items-center justify-center relative overflow-hidden px-margin-mobile pt-16">
<!-- Atmospheric Background Element -->
<div class="absolute inset-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/5 rounded-full blur-[120px]"></div>
</div>
<!-- Auth Card Container -->
<div class="relative z-10 w-full max-w-[440px] bg-[#1a2332] border border-[#2d3748] rounded-xl p-xl teal-glow transition-all duration-500" id="auth-card">
<!-- Logo & Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-surface-container-lowest border border-[#2d3748] rounded-xl flex items-center justify-center mb-md shadow-inner">
<span class="text-primary font-bold text-headline-lg">P2P</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Peer Learn</h1>
<p class="font-body-sm text-body-sm text-[#546e7a] text-center">School21 peer-to-peer o'qitish platformasi</p>
</div>
<!-- Step 1: Login Form -->
<div class="space-y-lg" id="step-1">
<div class="space-y-md">
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Login</label>
<div class="relative input-focus-dot">
<input class="w-full bg-[#0f1923] border border-[#2d3748] rounded-lg px-md py-md text-on-surface focus:outline-none focus:border-primary transition-colors placeholder:text-outline-variant font-body-md" placeholder="username" type="text"/>
</div>
</div>
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Parol</label>
<div class="relative input-focus-dot">
<input class="w-full bg-[#0f1923] border border-[#2d3748] rounded-lg px-md py-md text-on-surface focus:outline-none focus:border-primary transition-colors placeholder:text-outline-variant font-body-md" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-md rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" onclick="goToStep2()">
                    Kirish
                    <span class="material-symbols-outlined text-[20px]">login</span>
</button>
<div class="text-center">
<a class="font-body-sm text-body-sm text-primary hover:underline transition-all" href="#">Parolni unutdingizmi?</a>
</div>
</div>
<!-- Step 2: Telegram OTP Verification (Hidden by default) -->
<div class="hidden space-y-lg animate-in fade-in slide-in-from-right-4 duration-500" id="step-2">
<div class="bg-surface-container-lowest p-md rounded-lg border border-outline-variant flex items-center gap-md">
<span class="material-symbols-outlined text-primary text-[32px]">send</span>
<div>
<p class="font-label-md text-label-md text-on-surface">Tasdiqlash kodi</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Telegram bot orqali yuborildi</p>
</div>
</div>
<div class="space-y-md">
<div class="relative input-focus-dot">
<input class="w-full bg-[#0f1923] border border-[#2d3748] rounded-lg px-md py-md text-on-surface text-center tracking-[0.5em] font-headline-lg focus:outline-none focus:border-primary transition-colors placeholder:text-outline-variant" maxlength="6" placeholder="000 000" type="text"/>
</div>
<div class="flex flex-col gap-sm">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-md rounded-lg hover:brightness-110 active:scale-[0.98] transition-all">
                            Tasdiqlash
                        </button>
<button class="w-full border border-[#2d3748] text-primary font-headline-md text-headline-md py-md rounded-lg hover:bg-surface-container-high active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]">rocket_launch</span>
                            Open bot
                        </button>
</div>
</div>
<div class="text-center">
<button class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-all flex items-center justify-center mx-auto gap-xs" onclick="goToStep1()">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                        Orqaga qaytish
                    </button>
</div>
</div>
</div>
</main>
<!-- Footer Decoration -->
<footer class="fixed bottom-0 w-full py-md text-center pointer-events-none opacity-30">
<p class="font-label-md text-label-md text-outline-variant">© 2024 Peer Learn Ecosystem. All Rights Reserved.</p>
</footer>
<script>
        function goToStep2() {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
        }

        function goToStep1() {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
        }

        // Simple mouse tracking glow effect for the card
        const card = document.getElementById('auth-card');
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // This could be used for a more complex CSS radial gradient background
            // card.style.setProperty('--mouse-x', `${x}px`);
            // card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
